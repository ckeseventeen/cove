[package]
name = "nimbus-desktop"
version = "0.1.0"
description = "Cove macOS personal cloud media haven"
authors = ["Cove contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "nimbus_lib"
# No cdylib: that is for Android, and a library this size cannot be linked as one for Windows
# with MinGW (too many exports).
crate-type = ["staticlib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
parking_lot = "0.12"
axum = "0.8"
keyring = "3"
quick-xml = { version = "0.37", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "multipart", "socks"] }
md5 = "0.7"
percent-encoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "fs"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
notify = "8"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# libmpv-2.dll is loaded at run time from beside Cove.exe, so building needs no import library.
libloading = "0.8"
# The system media controls (SMTC): media keys and the volume flyout's player.
souvlaki = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
